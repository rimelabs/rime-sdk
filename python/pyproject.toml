[project]
name = "rimelabs-sdk"
version = "0.1.0a7"
description = "Async Rime speech SDK"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-PRISM", "NOTICE-PRISM"]
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.74,<2",
    "rime-api==0.1.0",
    "livekit-blingfire==1.1.0",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "audioop-lts>=0.2,<1 ; python_full_version >= '3.13'",
]
[project.urls]
Documentation = "https://docs.rime.ai/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/rimelabs_sdk"]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.15",
    "mypy>=1.15",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

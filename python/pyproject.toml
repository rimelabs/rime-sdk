[project]
name = "rimelabs-sdk"
version = "0.1.0a1"
description = "Async Rime text-to-speech SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"
[tool.maturin]
manifest-path = "../bindings/python/Cargo.toml"
python-source = "src"
module-name = "rimelabs_sdk._native"
bindings = "pyo3"
include = ["THIRD_PARTY_LICENSES.md", "src/rimelabs_sdk/py.typed", "src/rimelabs_sdk/*.pyi"]
[dependency-groups]
dev = [
    "grpcio>=1.74,<2",
    "rime-api==0.0.1",
    "maturin>=1.14,<2",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.15",
    "mypy>=1.15",
    "audioop-lts>=0.2,<1 ; python_full_version >= '3.13'",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

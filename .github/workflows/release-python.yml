name: Release Python
on:
  push:
    tags: ['python-v*']
permissions:
  contents: read
jobs:
  packages:
    uses: ./.github/workflows/native-build.yml
  release:
    needs: packages
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: collected
      - name: Verify version and complete wheel set
        run: |
          uv run --no-project python -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"] == "python-v" + tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"]'
          mkdir dist
          find collected -name '*.whl' -exec cp {} dist/ \;
          test "$(find dist -name '*.whl' | wc -l)" -eq 5
      - name: Build source distribution
        run: uv build python --sdist --out-dir dist
      - run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

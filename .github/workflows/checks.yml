name: Package checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.paths.outputs.python }}
      typescript: ${{ steps.paths.outputs.typescript }}
      go: ${{ steps.paths.outputs.go }}
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python=false
          typescript=false
          go=false
          rust=false
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            python=true
            typescript=true
            go=true
            rust=true
          else
            while IFS= read -r path; do
              case "$path" in
                python/*|examples/python/*) python=true ;;
                typescript/*|examples/typescript/*) typescript=true ;;
                go/*) go=true ;;
                rust/*) rust=true ;;
                conformance/*|docs/*|.github/*|examples/audio/*|examples/TERMINAL_VOICE.md|examples/README.md|README.md|RELEASING.md|release-please-config.json|.release-please-manifest.json) python=true; typescript=true; go=true; rust=true ;;
              esac
            done < <(git diff --name-only "$BASE" HEAD)
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "typescript=$typescript" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --dev
      - run: uv sync --project ../examples/python --locked
      - run: uv run python ../.github/scripts/check-release-versions.py
      - run: uv run ruff check src tests ../examples/python
      - run: uv run ruff format --check src tests ../examples/python
      - run: uv run mypy src
      - run: uv run pytest
      - name: Check release automation
        run: |
          uv run ruff check ../.github/scripts/update-example-dependency.py ../.github/scripts/tests
          uv run ruff format --check ../.github/scripts/update-example-dependency.py ../.github/scripts/tests
          uv run pytest ../.github/scripts/tests
      - run: uv build
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm --prefix ../examples/typescript ci
      - run: npm --prefix ../examples/typescript run check
      - run: npm --prefix ../examples/typescript test
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm pack
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', 'stable']
    defaults:
      run:
        working-directory: go
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: Check shared fixtures and formatting
        run: |
          for fixture in sentences contract audio mulaw pcm-input stt/transcripts; do
            cmp "../conformance/$fixture.json" "testdata/$fixture.json"
          done
          test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./...
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.88.0', stable]
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Check shared fixtures and WASM
        run: |
          for fixture in sentences contract audio mulaw; do
            cmp "../conformance/$fixture.json" "testdata/$fixture.json"
          done
          cmp ../go/internal/sentences/blingfire.wasm vendor/blingfire.wasm
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Diagnose Windows sentence detection
        if: runner.os == 'Windows'
        run: cargo test --locked sentences:: -- --test-threads=1 --nocapture
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
      - run: cargo package --locked

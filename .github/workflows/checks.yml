name: Package checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/native-build.yml
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - run: uv sync --project python --locked --dev
      - run: npm ci --prefix typescript
      - run: uv run --project python --no-sync python tools/check-schema.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features test-support -- -D warnings
      - run: uv run --project python --no-sync ruff check python/src python/tests
      - run: uv run --project python --no-sync ruff format --check python/src python/tests
      - run: uv run --project python --no-sync mypy --config-file python/pyproject.toml python/src
      - run: npm run check --prefix typescript
      - run: npm run lint --prefix typescript
      - run: uv run --no-project tools/build-native.py --test-support
      - run: uv run --project python --no-sync pytest python/tests
      - run: npm test --prefix typescript
      - name: Check source distribution
        run: uv build python --sdist --out-dir artifacts/sdist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: artifacts/sdist/

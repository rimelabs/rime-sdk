name: Package checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.paths.outputs.python }}
      typescript: ${{ steps.paths.outputs.typescript }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python=false
          typescript=false
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            python=true
            typescript=true
          else
            while IFS= read -r path; do
              case "$path" in
                python/*|examples/python/*) python=true ;;
                typescript/*|examples/typescript/*) typescript=true ;;
                conformance/*|docs/*|.github/*|examples/README.md|README.md|RELEASING.md|release-please-config.json|.release-please-manifest.json) python=true; typescript=true ;;
              esac
            done < <(git diff --name-only "$BASE" HEAD)
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "typescript=$typescript" >> "$GITHUB_OUTPUT"
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --dev
      - run: uv run python ../.github/scripts/check-release-versions.py
      - run: uv run ruff check src tests ../examples/python
      - run: uv run ruff format --check src tests ../examples/python
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm pack

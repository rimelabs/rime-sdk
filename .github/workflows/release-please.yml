name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      python_tag:
        description: 'Recovery only: existing Python release tag to publish'
        type: string
        default: ''
      typescript_tag:
        description: 'Recovery only: existing Node.js release tag to publish'
        type: string
        default: ''
      go_tag:
        description: 'Recovery only: existing Go release tag to verify'
        type: string
        default: ''
      rust_tag:
        description: 'Recovery only: existing Rust release tag to publish'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && !inputs.python_tag && !inputs.typescript_tag && !inputs.go_tag && !inputs.rust_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      python_tag: ${{ steps.release.outputs['python--tag_name'] }}
      typescript_tag: ${{ steps.release.outputs['typescript--tag_name'] }}
      go_tag: ${{ steps.release.outputs['go--tag_name'] }}
      rust_tag: ${{ steps.release.outputs['rust--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: main
      # GITHUB_TOKEN does not trigger pull_request CI. Find the open release PR
      # even on a retry where Release Please did not change it.
      - uses: actions/github-script@v7
        id: pr
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main',
            });
            const pr = prs.find(pr =>
              pr.user.login === 'github-actions[bot]' &&
              pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.head.ref.startsWith('release-please--') &&
              pr.labels.some(label => label.name === 'autorelease: pending')
            );
            if (pr) core.setOutput('branch', pr.head.ref);
      # Release Please can leave the branch unchanged when release notes are unchanged.
      - name: Update release branch from main
        if: steps.pr.outputs.branch != ''
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
        with:
          script: |
            try {
              await github.rest.repos.merge({
                ...context.repo,
                base: process.env.RELEASE_BRANCH,
                head: 'main',
                commit_message: 'chore: update release branch from main',
              });
            } catch (error) {
              if (error.status === 409) {
                core.setFailed(`Merge conflict: update ${process.env.RELEASE_BRANCH} from main manually, then rerun this workflow.`);
                return;
              }
              throw error;
            }
      - uses: actions/checkout@v4
        if: steps.pr.outputs.branch != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - uses: astral-sh/setup-uv@v6
        if: steps.pr.outputs.branch != ''
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.branch != ''
        with:
          node-version: '22'
      - name: Update release metadata and workspace lockfiles
        if: steps.pr.outputs.branch != ''
        run: |
          version=$(uv version --project python --short)
          uv version --project python --no-sync "$version"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add python/pyproject.toml python/uv.lock package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update release metadata'
            git push
          fi
      - name: Run checks on the release PR branch
        if: steps.pr.outputs.branch != ''
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ steps.pr.outputs.branch }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'checks.yml',
              ref: process.env.RELEASE_BRANCH,
            });

  python:
    needs: prepare
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.prepare.outputs.python_tag != '' || inputs.python_tag != '')
    runs-on: ubuntu-latest
    environment: pypi
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.python_tag || inputs.python_tag }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - name: Verify release version and alpha policy
        id: version
        run: |
          uv run python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          from packaging.version import Version

          manifest = json.loads(Path('../.release-please-manifest.json').read_text())
          config = json.loads(Path('../release-please-config.json').read_text())
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'python-v' + manifest['python']
          assert Version(version) == Version(manifest['python'])
          if config['prerelease']:
              assert Version(version).pre and Version(version).pre[0] == 'a'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  typescript:
    needs: prepare
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.prepare.outputs.typescript_tag != '' || inputs.typescript_tag != '')
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.typescript_tag || inputs.typescript_tag }}
      # Retain the existing npm provenance policy during the visibility change.
      NPM_CONFIG_PROVENANCE: 'false'
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.18.0
      - run: npm --prefix .. ci
      - name: Verify release version and alpha policy
        id: version
        run: |
          node --input-type=commonjs <<'JS'
          const assert = require('node:assert/strict');
          const { version } = require('./package.json');
          const manifest = require('../.release-please-manifest.json');
          const config = require('../release-please-config.json');
          assert.equal(process.env.RELEASE_TAG, 'typescript-v' + version);
          assert.equal(version, manifest.typescript);
          if (config.prerelease) assert.match(version, /^\d+\.\d+\.\d+-alpha\.\d+$/);
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm pack --workspace @rimelabs/sdk
      - name: Publish package
        run: npm publish --workspace @rimelabs/sdk --access public --tag latest

  go:
    timeout-minutes: 15
    needs: prepare
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.prepare.outputs.go_tag != '' || inputs.go_tag != '')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.go_tag || inputs.go_tag }}
    defaults:
      run:
        working-directory: go
    steps:
      - name: Verify public repository access
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != false ]; then
            echo 'Make the repository public before verifying the Go release.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Check release version and fixtures
        run: |
          test "$RELEASE_TAG" = "go/v$(cat version.txt)"
          for fixture in sentences contract audio mulaw; do
            cmp "../conformance/$fixture.json" "testdata/$fixture.json"
          done
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Download and build the published Go module
        run: bash tools/check-public-release.sh "$RELEASE_TAG"

  rust:
    needs: prepare
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.prepare.outputs.rust_tag != '' || inputs.rust_tag != '')
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.rust_tag || inputs.rust_tag }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - name: Verify Rust release version
        run: |
          uv run --no-project python - <<'PY'
          import json, os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          manifest = json.loads(pathlib.Path('../.release-please-manifest.json').read_text())
          assert version == manifest['rust']
          assert os.environ['RELEASE_TAG'] == 'rust-v' + version
          assert re.fullmatch(r'\d+\.\d+\.\d+-alpha\.\d+', version)
          PY
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish Rust SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  check-python-examples:
    needs: [prepare, python]
    if: ${{ !cancelled() && needs.python.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/check-published-examples.yml
    with:
      language: python
      version: ${{ needs.python.outputs.version }}
      ref: ${{ needs.prepare.outputs.python_tag || inputs.python_tag }}

  check-typescript-examples:
    needs: [prepare, typescript]
    if: ${{ !cancelled() && needs.typescript.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/check-published-examples.yml
    with:
      language: typescript
      version: ${{ needs.typescript.outputs.version }}
      ref: ${{ needs.prepare.outputs.typescript_tag || inputs.typescript_tag }}

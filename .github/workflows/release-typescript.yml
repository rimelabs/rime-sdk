name: Release Node.js
on:
  push:
    tags: ['typescript-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify package tag
        run: node -e 'const p = require("./package.json"); if(process.env.GITHUB_REF_NAME !== "typescript-v" + p.version) process.exit(1)'
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm pack
      - name: Publish package
        run: |
          tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm publish --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release Node.js
on:
  push:
    tags: ['typescript-v*']
permissions:
  contents: read
jobs:
  packages:
    uses: ./.github/workflows/native-build.yml
  release:
    needs: packages
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: collected
      - name: Verify version and complete binary set
        run: |
          node -e 'if(process.env.GITHUB_REF_NAME !== "typescript-v" + require("./package.json").version) process.exit(1)'
          mkdir -p native
          find ../collected -path '*/native/*.node' -exec cp {} native/ \;
          test "$(find native -name '*.node' | wc -l)" -eq 5
      - run: npm ci
      - run: npm pack
      - name: Publish the tested native bundle
        run: |
          tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm publish rimelabs-sdk-*.tgz --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

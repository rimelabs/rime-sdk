[package]
name = "rimelabs-sdk"
version = "0.1.0-alpha.8"
edition = "2021"
rust-version = "1.88"
description = "Rime streaming TTS, STT and Prism realtime SDK"
license = "MIT AND Apache-2.0"
repository = "https://github.com/rimelabs/rime-sdk"
readme = "README.md"
include = ["src/**", "testdata/**", "examples/**", "README.md", "LICENSE", "LICENSE-PRISM", "NOTICE-PRISM", "CHANGELOG.md"]

[dependencies]
rimelabs-api = "0.4.0"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
sha2 = "0.11"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
serde_yaml = "0.9"
tonic = { version = "0.14", default-features = false, features = ["router"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[example]]
name = "realtime_live"
test = true

[package]
name = "rimelabs-sdk"
version = "0.1.0-alpha.4"
edition = "2021"
rust-version = "1.88"
description = "Rime streaming text-to-speech and speech recognition SDK"
license = "MIT AND (Apache-2.0 WITH LLVM-exception)"
repository = "https://github.com/rimelabs/rime-sdk"
readme = "README.md"
include = ["src/**", "vendor/**", "testdata/**", "examples/**", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
rimelabs-api = "0.4.0"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots"] }
# Wasmi 2.0 crashes during BlingFire initialization on Windows.
wasmi = { version = "1.1", default-features = false, features = ["std"] }
wasmi_wasi = "1.1"

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["router"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_ir]
opt-level = 3

[profile.dev.package.wasmi_core]
opt-level = 3
